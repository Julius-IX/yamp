<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title | default: site.title }}</title>
  <meta name="description" content="Stream, download and sync your music on desktop and Android.">
  <meta property="og:title" content="Yamp">
  <meta property="og:description" content="Stream, download and sync your music on desktop and Android.">
  <meta property="og:image" content="https://yamp.cc/assets/previews/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:url" content="https://yamp.cc">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Yamp">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="theme-color" content="#0d1117">
  <link rel="icon" href="/assets/icons/mint-app-icon.png">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/github-markdown-css@5/github-markdown-dark.css">
  <style>
    body { margin: 0; background: #0d1117; }
    .markdown-body {
      box-sizing: border-box;
      max-width: 980px;
      margin: 0 auto;
      padding: 45px;
    }
    @media (max-width: 767px) {
      .markdown-body { padding: 15px; }
    }
  </style>
</head>
<body>
  <article class="markdown-body">
    {{ content }}
  </article>
</body>
</html>
