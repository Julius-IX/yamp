[package]
name = "yamp"
version = "1.1.0"
description = "Yet Another Music Player"
authors = ["Julius Schutte"]
edition = "2024"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "yamp_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri-groups = { version = "0.2.0" , path = "./crates/tauri_groups" }
ts-types = { version = "0.2.0", path = "./crates/ts_types" }
yt-api = { version = "0.1.0", path = "./crates/yt_api" }
tauri-settings = { version = "0.1.0", path = "./crates/tauri_settings" }
yamp-session = { version = "0.1.0", path = "./crates/yamp_session" }
yamp-transfer = { version = "0.1.0", path = "./crates/yamp_transfer" }
yamp-db = { version = "0.1.0", path = "./crates/yamp_db" }
yamp-storage = { version = "0.1.0", path = "./crates/yamp_storage" }
file-server = { version = "0.1.0", path = "./crates/file_server" }
folder-watch = { version = "0.1.0", path = "./crates/folder_watch" }
cloud-sync = { version = "0.1.0", path = "./crates/cloud_sync" }
cloud-auth = { version = "0.1.0", path = "./crates/cloud_auth" }
yamp-discord = { version = "0.1.0", path = "./crates/yamp_discord" }
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
tauri-plugin-fs = "2"

# a phone is updated through its store or by the user, there the plugin has nothing to replace
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-deep-link = "2"

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.15"

[target.'cfg(target_os = "ios")'.dependencies]
oslog = "0.2"

[workspace]
members = ["crates/*"]

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
