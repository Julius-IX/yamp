[package]
name = "yamp-session"
version = "0.1.0"
edition = "2024"
# required by tauri-plugin, the crate registers itself as a plugin to reach the app handle
links = "yamp-session"

[dependencies]
log = "0.4"
tauri = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# zbus keeps the Linux build free of the system libdbus
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
souvlaki = { version = "0.8", default-features = false, features = ["use_zbus"] }

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
