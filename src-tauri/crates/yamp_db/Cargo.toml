[package]
name = "yamp-db"
version = "0.1.0"
edition = "2024"

[dependencies]
# Only the formats a cover is likely to come in, and no codec that needs a system library. The
# default features would add every format and the threading of the resize.
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
# A cover travels inside the JSON of the link as text
base64 = "0.22"
cloud-kit = { path = "../cloud_kit" }
cloud-sync = { path = "../cloud_sync" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
# Bundled SQLite, so every platform runs the same version and has STRICT tables and unixepoch().
# Queries are checked at compile time. A build with DATABASE_URL set checks them against that
# database, any other build uses the data in `.sqlx` at the workspace root, see the readme.
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "migrate"] }
tokio = { version = "1", features = ["fs", "rt"] }
# Reads the tags of local audio files. Metadata only, nothing is decoded.
lofty = "0.22"
# Ids made here must not collide with ids made on another device
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
