[package]
name = "yamp-db"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1", features = ["derive"] }
# Bundled SQLite, so every platform runs the same version and has STRICT tables and unixepoch().
# Queries are checked at compile time. A build with DATABASE_URL set checks them against that
# database, any other build uses the data in `.sqlx` at the workspace root, see the readme.
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "migrate"] }
tokio = { version = "1", features = ["fs"] }
# Ids made here must not collide with ids made on another device
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
