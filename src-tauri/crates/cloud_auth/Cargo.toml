[package]
name = "cloud-auth"
version = "0.1.0"
edition = "2024"

[dependencies]
cloud-sync = { path = "../cloud_sync" }
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }
percent-encoding = "2"
sha2 = "0.10"
base64 = "0.22"
getrandom = "0.2"
