[package]
name = "tauri-settings"
version = "0.1.0"
edition = "2024"

[features]
default = ["tauri"]
# Managed state, `init` and the commands for the frontend. Without it only the store is built.
tauri = ["dep:tauri", "dep:tauri-groups"]

[dependencies]
log = "0.4"
serde = "1"
serde_json = "1"
tauri = { version = "2", optional = true }
tauri-groups = { version = "0.2.0", path = "../tauri_groups", optional = true }
